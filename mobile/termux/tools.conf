# Tools the workbench installs and keeps updated. Set an entry to 0 to skip it.
# Edit inside the workbench: ~/.workbench/tools.conf, then run `dev-update --now`.
HERDR=1
HERMES=1
CLAUDE=1
CODEX=1
GEMINI=1
OPENCODE=1
COPILOT=1
# extra global npm packages, space separated
NPM_EXTRA=""
# extra apt packages, space separated
APT_EXTRA=""
# hours between automatic background updates (0 disables)
UPDATE_EVERY_HOURS=24
