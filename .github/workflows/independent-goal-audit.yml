name: Independent goal engine audit
on:
  push:
    branches: [codex/goal-audit-20261030, codex/goal-audit-round2-20261030, ccr-efd59209-8jk5t6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original goal tests
        id: original
        continue-on-error: true
        shell: bash
        run: |
          cd app
          result=0
          go test -race -timeout 4m -count=1 -v ./internal/goal -skip 'Independent(Audit|Round2)' > original-tests.txt 2>&1 || result=$?
          cat original-tests.txt
          exit $result
      - name: New behavioral regressions
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          cd app
          result=0
          go test -race -timeout 4m -count=1 -v ./internal/goal -run 'Independent(Audit|Round2)' > audit-tests.txt 2>&1 || result=$?
          cat audit-tests.txt
          exit $result
      - name: Build real goal executable
        shell: bash
        run: |
          cd app
          go build ./cmd/herdr-goal
      - name: Web behavioral tests
        id: web
        continue-on-error: true
        shell: bash
        run: node --test app/tests/web/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Document pipeline tests (stdlib only; oracles skipped when absent)
        id: docpipe
        continue-on-error: true
        shell: bash
        run: |
          # Test oracles only (independent readers to compare against); the product needs no package.
          python -m pip install --quiet openpyxl python-docx python-pptx || echo "oracles not installed; their checks skip"
          cd tools/docpipe
          python -m unittest discover -s tests -v > ../../app/docpipe-tests.txt 2>&1 || r=$?
          cat ../../app/docpipe-tests.txt
          exit ${r:-0}
      - name: PowerShell scripts parse (Windows PowerShell 5.1 and 7)
        id: psparse
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('tools/docpipe/com-extract.ps1', 'tools/docpipe/docpipe.ps1', 'tools/docpipe/tests/ps/run-docpipe-ps.ps1', 'tools/device-harness/run-device-gates.ps1')) {
            $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { Write-Output "PARSE ERROR $f : $($errs[0].Message)"; $bad++ } else { Write-Output "parses (pwsh 7): $f" }
          }
          powershell -NoProfile -Command "`$e=`$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/docpipe/com-extract.ps1'), [ref]`$null, [ref]`$e); if (`$e) { 'PARSE ERROR (5.1): ' + `$e[0].Message; exit 1 } else { 'parses (Windows PowerShell 5.1)' }"
          if ($LASTEXITCODE) { $bad++ }
          # PowerShell-only pipeline on recorded worker output (no Office here), in 7 and in 5.1
          pwsh -NoProfile -File tools/docpipe/tests/ps/run-docpipe-ps.ps1
          if ($LASTEXITCODE) { $bad++ }
          powershell -NoProfile -File tools/docpipe/tests/ps/run-docpipe-ps.ps1
          if ($LASTEXITCODE) { $bad++ }
          $office = foreach ($p in 'Excel.Application','Word.Application','PowerPoint.Application') { "$p registered: $([bool](Get-Item -Path "Registry::HKEY_CLASSES_ROOT\$p\CLSID" -ErrorAction SilentlyContinue))" }
          $office
          exit $bad
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.os }}
          path: app/*tests.txt
      - name: Fail the audit when any behavioral suite fails
        if: always() && (steps.original.outcome != 'success' || steps.regressions.outcome != 'success' || steps.web.outcome != 'success' || steps.docpipe.outcome != 'success' || steps.psparse.outcome == 'failure')
        shell: bash
        run: |
          echo "A behavioral suite failed. Read the evidence artifacts; this is not a passing product certification."
          exit 1

