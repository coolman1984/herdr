<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Herdr Deck</title>
<link rel="preload" href="fonts/Alexandria-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#grid">Skip to panes</a>
<header class="top" role="banner">
  <button id="btn-rail" class="icon" aria-label="Sidebar (Ctrl+B B)" aria-pressed="true" data-tip="Sidebar · Ctrl+B b"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg></button>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span class="lbl">Herdr Deck</span><span id="session" class="sess"></span></div>
  <div class="tgroup" role="group" aria-label="Create">
    <button id="btn-agent" class="primary" aria-label="Start an agent" data-tip="Start an agent"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Agent</span></button>
    <button id="btn-shell" aria-label="New shell" data-tip="New shell next to the current pane"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6l5 5-5 5M11 18h9"/></svg><span class="lbl">Shell</span></button>
    <button id="btn-folder" aria-label="Open folder (Ctrl+B F)" data-tip="Open a folder as a new space · Ctrl+B f"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg><span class="lbl">Folder</span></button>
    <button id="btn-team" aria-label="Team presets" data-tip="Start a team preset"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.3a3.5 3.5 0 0 1 0 6.4M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span class="lbl">Team</span></button>
  </div>
  <div class="tgroup" role="group" aria-label="View">
    <div class="seg" role="group" aria-label="Grid columns or Herdr splits">
      <button data-cols="1" aria-pressed="false" aria-label="1 column (1)" data-tip="1 column · 1">1</button>
      <button data-cols="2" aria-pressed="false" aria-label="2 columns (2)" data-tip="2 columns · 2">2</button>
      <button data-cols="3" aria-pressed="false" aria-label="3 columns (3)" data-tip="3 columns · 3">3</button>
      <button data-view="layout" aria-pressed="false" aria-label="Herdr's real splits (L)" data-tip="Herdr's real splits · L">Splits</button>
    </div>
    <button id="btn-layout" class="icon" aria-label="Layout builder (Ctrl+B Shift+B)" data-tip="Layout builder · Ctrl+B Shift+B"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7"/></svg></button>
  </div>
  <div class="tgroup" role="group" aria-label="Status">
    <div id="counts" class="counts" role="group" aria-label="Agent states"></div>
    <button id="btn-inbox" data-drawer="inbox" aria-label="Attention inbox (I)" data-tip="Attention inbox · I"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 13l2.5-8h13L21 13v6H3zM3 13h5l1.5 3h5L16 13h5"/></svg><span class="lbl">Inbox</span><span id="inbox-n" class="badge-n" hidden></span></button>
    <button id="btn-usage" data-drawer="usage" aria-label="Usage and limits" data-tip="Usage and limits"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 14l4-4M4.9 19a9 9 0 1 1 14.2 0"/></svg><span class="lbl">Usage</span><span id="usage-n" class="badge-n"></span></button>
  </div>
  <span class="grow"></span>
  <div class="tgroup" role="group" aria-label="Tools">
    <button id="btn-search" class="icon" data-drawer="search" aria-label="Search all screens (Ctrl+Shift+F)" data-tip="Search · Ctrl+Shift+F"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg></button>
    <button id="btn-palette" class="cmd" aria-label="Command palette (Ctrl+K)" data-tip="Every command · Ctrl+K"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></svg><span class="lbl">Commands</span><kbd class="lbl">Ctrl K</kbd></button>
    <button id="btn-more" class="icon" aria-label="More: board, agents hub, tools, keys, settings" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" data-tip="More"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="stroke-width:3.2"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    <label class="safe-t" data-tip="Read-only: every write is refused"><input type="checkbox" id="safe"> Safe</label>
  </div>
</header>
<div id="more-menu" class="menu card-popover more-menu" role="menu" aria-label="More" hidden>
  <button role="menuitem" id="btn-board" data-drawer="board"><span>Agent board</span><kbd>Ctrl+B a</kbd></button>
  <button role="menuitem" id="btn-agents" data-drawer="agents"><span>Agents hub (herdr-agents)</span><kbd>Ctrl+B m</kbd></button>
  <button role="menuitem" id="btn-tools" data-drawer="tools"><span>Tools: check, headless, skills</span><kbd>Ctrl+B .</kbd></button>
  <button role="menuitem" id="btn-spaces"><span>Spaces side by side</span><kbd>Ctrl+B S</kbd></button>
  <button role="menuitem" id="btn-settings"><span>Settings (look)</span><kbd>Ctrl+B s</kbd></button>
  <button role="menuitem" id="btn-help" data-drawer="help"><span>Keys and guide</span><kbd>?</kbd></button>
  <button role="menuitem" id="btn-stopall" class="danger"><span>Stop everything…</span><kbd>Ctrl+B Q</kbd></button>
</div>
<div id="banner" class="banner" hidden role="alert"></div>
<div id="rawbar" class="rawbar" hidden role="status"><span id="rawbar-text"></span><button id="rawbar-stop">Stop typing</button></div>
<form id="bcast" class="bcast" hidden aria-label="Broadcast">
  <span id="bcast-n" class="chip"></span>
  <input id="bcast-text" aria-label="Prompt for every selected pane" placeholder="One prompt for every selected pane">
  <button type="submit" class="primary">Send to all</button>
  <button type="button" id="bcast-compare">Compare</button>
  <button type="button" id="bcast-clear">Clear</button>
</form>
<div class="body">
  <nav class="rail" aria-label="Spaces and tabs">
    <div id="rail-nav" class="rail-nav"></div>
    <section id="health" class="health" aria-label="Health"></section>
  </nav>
  <div id="rail-split" class="divider v rail-split" role="separator" aria-orientation="vertical" aria-label="Sidebar width (arrows move, double-click resets)" tabindex="0"></div>
  <main class="main">
    <div id="empty" class="empty" hidden></div>
    <p id="grid-note" class="grid-note" aria-live="polite"></p>
    <div id="grid" class="grid" aria-label="Panes"></div>
  </main>
  <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
    <div id="drawer-split" class="divider v drawer-split" role="separator" aria-orientation="vertical" aria-label="Panel width (arrows move, double-click resets)" tabindex="0"></div>
    <div class="drawer-h"><h2 id="drawer-title"></h2><button id="drawer-close" class="icon" aria-label="Close panel (Esc)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
</div>
<footer id="statusbar" class="statusbar" data-ok="0"><span class="conn" aria-hidden="true"></span><span id="status-text" aria-live="polite">connecting…</span><span class="grow"></span><span id="status-age" class="muted"></span></footer>
<div id="chord" class="chord" hidden role="status"></div>
<div class="toast-stack"><div id="toasts" class="toasts" aria-live="polite"></div><div id="toasts-loud" class="toasts loud" aria-live="assertive"></div></div>
<noscript>Herdr Deck needs JavaScript.</noscript>
</body>
</html>
